<!doctype html>
<html lang="en">
<head>

  <title>TabTome — selected tabs</title>
  <link rel="stylesheet" href="stage.css">
</head>
<body>
  <main class="browser">
    <header class="toolbar" aria-hidden="true">

    <article class="page">
      <p class="kicker">Reading and archives</p>

    <aside class="popup-shell" aria-label="TabTome popup">
