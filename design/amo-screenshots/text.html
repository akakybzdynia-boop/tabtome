<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>TabTome — pasted text</title>
  <link rel="stylesheet" href="stage.css">
</head>
<body>
  <main class="browser">
    <header class="toolbar" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <div class="address">example.org/travel/overnight-train</div>
      <div class="toolbar-icon"><img src="../../extension/icons/icon-128.png" alt=""></div>
    </header>
    <article class="page">
      <p class="kicker">Travel notebook</p>
      <h1>Notes from a long train journey</h1>
      <p class="byline">Demo article · selected fragment</p>
      <p>At dawn the carriage became quiet. The notes were copied with their headings, lists, links, and one image.</p>
      <div class="article-image" aria-hidden="true"></div>
    </article>
    <aside class="popup-shell" aria-label="TabTome popup">
      <iframe title="TabTome text interface" src="text-popup.html"></iframe>
    </aside>
  </main>
</body>
</html>
