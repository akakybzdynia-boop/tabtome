name: Windows SignPath release candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-signpath-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-and-test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6

      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG
            SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace([string]$required[$_]) })
          if ($missing.Count -gt 0) {
            throw "Missing SignPath repository configuration: $($missing -join ', ')"
          }

      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = [string](Get-Content -Raw ./server/package.json | ConvertFrom-Json).version
          $expectedTag = "windows-v$version"
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne $expectedTag) {
            throw "Signing is allowed only from tag $expectedTag. Selected ref: ${{ github.ref }}"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file-version=$version.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: npm.cmd ci

      - name: Run project tests
        shell: pwsh
        run: npm.cmd test

      - name: Prepare pinned Windows build tools
        shell: pwsh
        run: ./installer/prepare-build-tools.ps1

      - name: Prepare unsigned installer stage
        shell: pwsh
        run: ./installer/build-installer.ps1 -SkipTests

      - name: Upload unsigned application binaries
        id: upload-unsigned-binaries
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-application-binaries-${{ github.sha }}
          path: |
            installer/stage/app/TabTomeSettings.exe
            installer/stage/app/host/TabTomeHost.exe
          if-no-files-found: error

      - name: Sign application binaries with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_BINARIES_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed-binaries
          parameters: |
            version: ${{ toJSON(steps.app-version.outputs.version) }}
            fileVersion: ${{ toJSON(steps.app-version.outputs.file-version) }}

      - name: Install signed application binaries into stage
        shell: pwsh
        run: ./installer/install-signed-binaries.ps1 -SignedArtifactDirectory '${{ runner.temp }}\signed-binaries'

      - name: Compile installer around signed binaries
        shell: pwsh
        run: ./installer/compile-installer.ps1

      - name: Upload unsigned outer installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-outer-installer-${{ github.sha }}
          path: outputs/TabTome-Setup-${{ steps.app-version.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign outer installer with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}\signed-installer
          parameters: |
            version: ${{ toJSON(steps.app-version.outputs.version) }}
            fileVersion: ${{ toJSON(steps.app-version.outputs.file-version) }}

      - name: Install and verify signed outer installer
        shell: pwsh
        run: ./installer/install-signed-installer.ps1 -SignedArtifactDirectory '${{ runner.temp }}\signed-installer'

      - name: Test signed isolated install and uninstall
        shell: pwsh
        run: ./installer/test-installer.ps1

      - name: Build signed release archives
        shell: pwsh
        run: ./scripts/package-release.ps1 -SkipInstaller

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v7
        with:
          name: tabtome-signed-${{ steps.app-version.outputs.version }}-${{ github.sha }}
          path: |
            outputs/1-TABTOME-FIREFOX-ADDON-*.zip
            outputs/1-TABTOME-CHROME-ADDON-*.zip
            outputs/2-TABTOME-SOURCE-CODE-*.zip
            outputs/TabTome-Project-*.zip
            outputs/TabTome-Setup-*.exe
            outputs/TabTome-Setup-*.exe.sha256
            outputs/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
