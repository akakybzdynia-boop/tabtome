<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>TabTome</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-i18n-document-title="extension_name">
  <main>
    <div class="heading">
      <h1 data-i18n="popup_title">Send to e-reader</h1>
      <button id="settings" type="button" class="link" data-i18n="settings">Settings</button>
    </div>
    <p id="server" class="status" data-i18n="checking_companion">Checking the app…</p>

    <div class="mode-switch" role="tablist" aria-label="Content to send" data-i18n-aria-label="send_what">
      <button id="mode-tabs" type="button" class="mode active" role="tab" aria-selected="true" aria-controls="tabs-panel" tabindex="0" data-i18n="tabs">Tabs</button>
      <button id="mode-text" type="button" class="mode" role="tab" aria-selected="false" aria-controls="text-panel" tabindex="-1" data-i18n="text">Text</button>
    </div>

    <form id="form">
      <label class="destination-picker">
        <span data-i18n="send_to">Send to</span>
        <select id="destination" aria-label="Recipient" data-i18n-aria-label="recipient"></select>
      </label>
      <label class="without-images"><input id="without-images" type="checkbox"><span data-i18n="without_images">Only text</span></label>
      <section id="tabs-panel" role="tabpanel" aria-labelledby="mode-tabs">
        <div class="tabs-toolbar">
          <div class="actions">
            <button id="all" type="button" class="link" data-i18n="select_all">Select all</button>
            <button id="none" type="button" class="link" data-i18n="clear_selection">Clear selection</button>
          </div>
          <span id="selected-count" class="selection-count">Selected: 0</span>
        </div>
        <input id="tab-search" class="tab-search" type="search" placeholder="Find a tab" aria-label="Find a tab" data-i18n-placeholder="find_tab" data-i18n-aria-label="find_tab" hidden>
        <div id="tabs" class="tabs"></div>
      </section>

      <section id="text-panel" role="tabpanel" aria-labelledby="mode-text" hidden>
        <div class="text-field">
          <div id="pasted-content-label" data-i18n="text">Text</div>
          <div
            id="pasted-content"
            class="rich-editor"
            contenteditable="true"
            role="textbox"
            aria-labelledby="pasted-content-label"
            aria-multiline="true"
            data-placeholder="Paste text or an image with Ctrl+V"
            data-i18n-data-placeholder="paste_placeholder"
          ></div>
        </div>
        <div class="text-meta">
          <span id="characters-limit">0 / 1,000,000 characters</span>
          <span id="images-limit">Images: 0 / 30</span>
        </div>
        <p class="hint" data-i18n="text_hint">Paragraphs, headings, lists, links, tables, and images are preserved. Page colors, fonts, and styles are removed. An unfinished draft stays in browser memory until the browser closes.</p>
      </section>

      <label class="book-title">
        <span data-i18n="book_title">Book title</span>
        <input id="title" placeholder="Optional" data-i18n-placeholder="optional" maxlength="200">
      </label>
      <p id="send-summary" class="send-summary"></p>
      <button id="send" type="submit" data-i18n="send_selected">Send selected tabs</button>
    </form>
    <p id="result" class="result" role="status"></p>
    <details id="job-details" class="job-details" hidden>
      <summary id="job-summary"></summary>
      <ul id="job-tabs"></ul>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
